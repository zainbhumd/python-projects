<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Karachi Real Estate Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

<div class="max-w-4xl mx-auto">
    <div class="flex gap-4 mb-8">
        <button onclick="showView('ai-view')" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold">AI Price Predictor</button>
        <button onclick="showView('search-view')" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-bold">Manage Properties</button>
    </div>

    <div id="ai-view" class="hidden bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold mb-6">AI Price Predictor</h2>
        <div class="grid grid-cols-2 gap-4">
            <input type="text" id="ai_location" placeholder="Location (e.g., Clifton)" class="p-3 border rounded">
            <select id="ai_type" class="p-3 border rounded"><option>House</option><option>Flat</option></select>
            <select id="ai_purpose" class="p-3 border rounded"><option>For Sale</option><option>For Rent</option></select>
            <input type="text" id="ai_beds" placeholder="Bedrooms" class="p-3 border rounded">
            <input type="text" id="ai_baths" placeholder="Bathrooms" class="p-3 border rounded">
            <input type="text" id="ai_yards" placeholder="Area in Sq. Yds." class="p-3 border rounded">
        </div>
        <button onclick="predictPrice()" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-bold">Predict Price</button>
        <h3 id="prediction_result" class="mt-4 font-bold text-center"></h3>
    </div>

    <div id="search-view" class="hidden space-y-6">
       
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4">Search Properties</h2>
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="s_area" class="p-2 border rounded" placeholder="Any Area">
                <select id="s_purpose" class="p-2 border rounded"><option value="">Any Purpose</option><option value="sale">Sale</option><option value="rent">Rent</option></select>
                <select id="s_type" class="p-2 border rounded">
                    <option value="">Any Type</option>
                    <option value="House">House</option>
                    <option value="Flat">Flat</option>
                    <option value="Upper Portion">Upper Portion</option>
                    <option value="Lower Portion">Lower Portion</option>
                </select>
                <input type="text" id="s_baths" placeholder="Min Baths" class="p-2 border rounded">
                <input type="text" id="s_beds" placeholder="Min Beds" class="p-2 border rounded">
                <input type="text" id="s_max_price" placeholder="Max Price" class="p-2 border rounded">
                <input type="text" id="s_min_price" placeholder="Min Price" class="p-2 border rounded">
                <input type="text" id="s_min_sq_feet" placeholder="Min Area (Sq. Ft.)" class="p-2 border rounded">
                <input type="text" id="s_max_sq_feet" placeholder="Max Area (Sq. Ft.)" class="p-2 border rounded">
                <input type="text" id="s_min_sq_yards" placeholder="Min Area (Sq. Yds.)" class="p-2 border rounded">
                <input type="text" id="s_max_sq_yards" placeholder="Max Area (Sq. Yds.)" class="p-2 border rounded">
            </div>
            <button onclick="searchProperties()" class="w-full mt-4 bg-green-600 text-white py-2 rounded font-bold">Search</button>
            <div id="results" class="mt-4 p-2 bg-gray-50 rounded"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="font-bold mb-2">Add Property</h2>
                <input type="text" id="a_id" placeholder="ID" class="w-full p-2 border mb-2">
                <input type="text" id="a_area" placeholder="Area" class="w-full p-2 border mb-2">
                <input type="text" id="a_price" placeholder="Price" class="w-full p-2 border mb-2">
                <input type="text" id="a_beds" placeholder="Beds" class="w-full p-2 border mb-2">
                <input type="text" id="a_baths" placeholder="Baths" class="w-full p-2 border mb-2">
                <input type="text" id="a_yards" placeholder="Area in Sq. Yds." class="w-full p-2 border mb-2">
                <select id="a_type" class="w-full p-2 border mb-2">
                    <option value="House">House</option>
                    <option value="Flat">Flat</option>
                    <option value="Upper Portion">Upper Portion</option>
                    <option value="Lower Portion">Lower Portion</option>
                </select>
                <button onclick="addProperty()" class="w-full bg-indigo-600 text-white py-2 mt-2 rounded">Add</button>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="font-bold mb-2">Update Price</h2>
                <input type="text" id="u_id" placeholder="ID" class="w-full p-2 border mb-2">
                <input type="text" id="u_price" placeholder="New Price" class="w-full p-2 border mb-2">
                <button onclick="updateProperty()" class="w-full bg-yellow-600 text-white py-2 mt-2 rounded">Update</button>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="font-bold mb-2">Delete Property</h2>
                <input type="text" id="d_id" placeholder="ID" class="w-full p-2 border mb-2">
                <button onclick="deleteProperty()" class="w-full bg-red-600 text-white py-2 mt-2 rounded">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
    function showView(viewId) {
        document.getElementById('ai-view').classList.add('hidden');
        document.getElementById('search-view').classList.add('hidden');
        document.getElementById(viewId).classList.remove('hidden');
    }
   
    const API_URL = "https://python-projects-0vyq.onrender.com/";

    // --- 1. AI PRICE PREDICTOR FUNCTION ---
    async function predictPrice() {
        const payload = {
            location: document.getElementById('ai_location').value,
            property_type: document.getElementById('ai_type').value,
            purpose: document.getElementById('ai_purpose').value,
            bathrooms: document.getElementById('ai_baths').value,
            bedrooms: document.getElementById('ai_beds').value,
            area_sq_yards: document.getElementById('ai_yards').value
        };

        try {
            const response = await fetch(`${API_URL}/predict_price`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (data.error) {
                document.getElementById('prediction_result').innerText = "Error: " + data.error;
            } else {
                document.getElementById('prediction_result').innerText = `Predicted Price: PKR ${data.predicted_price.toLocaleString()}`;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('prediction_result').innerText = "Cannot connect to backend server.";
        }
    }

    // --- 2. SEARCH PROPERTIES FUNCTION ---
    async function searchProperties() {
        const params = new URLSearchParams({
            area: document.getElementById('s_area').value,
            purpose: document.getElementById('s_purpose').value,
            property_type: document.getElementById('s_type').value,
            bathrooms: document.getElementById('s_baths').value,
            bedrooms: document.getElementById('s_beds').value,
            max_price: document.getElementById('s_max_price').value,
            min_price: document.getElementById('s_min_price').value,
            min_sq_feet: document.getElementById('s_min_sq_feet').value,
            max_sq_feet: document.getElementById('s_max_sq_feet').value,
            min_sq_yards: document.getElementById('s_min_sq_yards').value,
            max_sq_yards: document.getElementById('s_max_sq_yards').value,
        });

        try {
            const response = await fetch(`${API_URL}/properties?${params.toString()}`);
            const data = await response.json();
           
            // Basic layout rendering loop for results box
            let html = `<h4 class="font-bold mb-2">Results (${data.length}):</h4>`;
            if (data.length === 0) html += "<p class='text-sm text-gray-500'>No properties found matching criteria.</p>";
            data.forEach(p => {
                html += `<div class="border-b py-2 text-sm">
                    <strong>ID: ${p.property_id}</strong> - ${p.location} (${p.property_type} For ${p.purpose})<br>
                    Price: PKR ${p.final_price.toLocaleString()} | Beds: ${p.bedrooms} | Baths: ${p.bathrooms} | Yards: ${p.area_sq_yards}
                </div>`;
            });
            document.getElementById('results').innerHTML = html;
        } catch (err) {
            console.error(err);
            document.getElementById('results').innerText = "Failed to fetch search results.";
        }
    }

    // --- 3. ADD PROPERTY FUNCTION ---
    async function addProperty() {
        // Matches Pydantic 'Property' schema in MAIN.py expects numeric types for validation
        const payload = {
            property_id: parseInt(document.getElementById('a_id').value) || 0,
            location: document.getElementById('a_area').value,
            final_price: parseFloat(document.getElementById('a_price').value) || 0.0,
            bedrooms: parseInt(document.getElementById('a_beds').value) || 0,
            bathrooms: parseInt(document.getElementById('a_baths').value) || 0,
            area_sq_yards: parseFloat(document.getElementById('a_yards').value) || 0.0,
            area_sq_feet: (parseFloat(document.getElementById('a_yards').value) || 0.0) * 9.0, // Automatic conversion calculation
            property_type: document.getElementById('a_type').value,
            purpose: "Sale" // Standard default assignment matching UI visibility scope
        };

        try {
            const response = await fetch(`${API_URL}/add_property`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            alert(data.message || data.detail);
        } catch (err) {
            console.error(err);
            alert("Error sending addition request to backend.");
        }
    }

    // --- 4. UPDATE PROPERTY FUNCTION ---
    async function updateProperty() {
        const id = document.getElementById('u_id').value;
        const payload = {
            final_price: parseFloat(document.getElementById('u_price').value) || 0.0
        };

        if(!id) return alert("Please specify a valid property ID.");

        try {
            const response = await fetch(`${API_URL}/update_property/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            alert(data.message || data.detail);
        } catch (err) {
            console.error(err);
            alert("Error sending update request.");
        }
    }

    // --- 5. DELETE PROPERTY FUNCTION ---
    async function deleteProperty() {
        const id = document.getElementById('d_id').value;
        if(!id) return alert("Please specify a target property ID.");

        try {
            const response = await fetch(`${API_URL}/delete_property/${id}`, {
                method: "DELETE"
            });
            const data = await response.json();
            alert(data.message || data.detail);
        } catch (err) {
            console.error(err);
            alert("Error sending deletion request.");
        }
    }
</script>
</body>
</html>
